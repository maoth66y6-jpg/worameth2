<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#090d16" rx="12"/>
  <text x="400" y="45" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="18" text-anchor="middle">⚡ NETDEVOPS INFRASTRUCTURE AUTOMATION</text>
  <text x="400" y="70" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">GitOps &gt; Ansible Playbooks &gt; Python Netmiko &gt; 40+ Cisco IOS Switches</text>

  <!-- Step 1: Git Repo -->
  <g transform="translate(60, 130)">
    <rect width="180" height="170" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
    <circle cx="90" cy="45" r="22" fill="#ea580c"/>
    <text x="90" y="52" fill="#fff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">GIT</text>
    <text x="90" y=\"95\" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. Git Repository</text>
    <text x="90" y="120" fill="#fdba74" font-family="monospace" font-size="10" text-anchor="middle">YAML Host Inventory</text>
    <text x="90" y="140" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">VLAN, BGP, ACL Specs</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="240" y1="215" x2="300" y2="215" stroke="#06b6d4" stroke-width="3" stroke-dasharray="6 3"/>
  <polygon points="300,210 310,215 300,220" fill="#06b6d4"/>

  <!-- Step 2: Ansible & Python Engine -->
  <g transform="translate(310, 100)">
    <rect width="200" height="230" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="100" cy="40" r="22" fill="#0284c7"/>
    <text x="100" y="47" fill="#fff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">RUN</text>
    <text x="100" y="85" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. Automation Engine</text>
    
    <rect x="15" y="105" width="170" height="35" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="100" y="127" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Ansible Playbook</text>

    <rect x="15" y="150" width="170" height="35" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="100" y="172" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Python + Netmiko</text>

    <text x="100" y="210" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">SSH Multi-Thread Pool</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="510" y1="215" x2="570" y2="215" stroke="#10b981" stroke-width="3" stroke-dasharray="6 3"/>
  <polygon points="570,210 580,215 570,220" fill="#10b981"/>

  <!-- Step 3: Network Fabric -->
  <g transform="translate(580, 120)">
    <rect width="170" height="190" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="85" y="35" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. Network Fabric</text>
    
    <g transform="translate(15, 50)">
      <rect width="140" height="32" rx="4" fill="#334155"/>
      <text x="70" y="20" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">SW-Distribution (x4)</text>
    </g>
    <g transform="translate(15, 90)">
      <rect width="140" height="32" rx="4" fill="#334155"/>
      <text x="70" y="20" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">SW-Access (x36)</text>
    </g>
    <text x="85" y="145" fill="#4ade80" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✅ Zero Config Drift</text>
    <text x="85" y="165" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Execution: 45s (vs 4h manual)</text>
  </g>

  <!-- Bottom Notification Bar -->
  <rect x="160" y="365" width="480" height="42" rx="21" fill="#14532d" fill-opacity="0.7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="400" y="391" fill="#86efac" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🔔 GitOps Alert: Config verified, syntax tested &amp; committed to GitHub</text>
</svg>
