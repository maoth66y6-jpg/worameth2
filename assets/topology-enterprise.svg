<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gradNet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="#090d16" rx="12"/>
  <rect x="10" y="10" width="780" height="430" fill="url(#gradNet)" rx="8" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Cloud / ISP Section -->
  <path d="M 320 80 Q 400 40 480 80 Q 520 100 490 140 Q 430 160 370 140 Q 300 120 320 80 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="105" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">DUAL ISP &amp; WAN CLOUD</text>
  <text x="400" y="125" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">AS65000 (eBGP Mesh)</text>

  <!-- Connection Lines -->
  <line x1="360" y1="145" x2="220" y2="220" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="6 3"/>
  <line x1="440" y1="145" x2="580" y2="220" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="6 3"/>
  <line x1="400" y1="150" x2="400" y2="290" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- IPsec VPN Line HQ to Branch 1 -->
  <path d="M 230 250 C 400 340 420 340 570 250" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 5"/>
  <text x="400" y="325" fill="#fbbf24" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">🔒 IPsec Site-to-Site VPN Tunnel (Failover)</text>

  <!-- HQ Edge Router -->
  <g transform="translate(160, 200)">
    <rect width="120" height="70" rx="8" fill="url(#cardGrad)" stroke="#0ea5e9" stroke-width="2" filter="url(#glow)"/>
    <circle cx="30" cy="35" r="16" fill="#0284c7"/>
    <text x="30" y="40" fill="#fff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">R1</text>
    <text x="75" y="30" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">HQ-EDGE</text>
    <text x="75" y="46" fill="#38bdf8" font-family="monospace" font-size="9">192.168.1.1</text>
    <text x="75" y="58" fill="#94a3b8" font-family="monospace" font-size="9">BGP AS65101</text>
  </g>

  <!-- Branch 1 Edge Router -->
  <g transform="translate(520, 200)">
    <rect width="120" height="70" rx="8" fill="url(#cardGrad)" stroke="#0ea5e9" stroke-width="2" filter="url(#glow)"/>
    <circle cx="30" cy="35" r="16" fill="#0284c7"/>
    <text x="30" y="40" fill="#fff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">R2</text>
    <text x="75" y="30" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">BR1-EDGE</text>
    <text x="75" y="46" fill="#38bdf8" font-family="monospace" font-size="9">192.168.2.1</text>
    <text x="75" y="58" fill="#94a3b8" font-family="monospace" font-size="9">BGP AS65102</text>
  </g>

  <!-- Branch 2 / Cloud VPC -->
  <g transform="translate(340, 290)">
    <rect width="120" height="70" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    <circle cx="30" cy="35" r="16" fill="#059669"/>
    <text x="30" y="40" fill="#fff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">FW</text>
    <text x="75" y="30" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">pfSense</text>
    <text x="75" y="46" fill="#34d399" font-family="monospace" font-size="9">WireGuard GW</text>
    <text x="75" y="58" fill="#94a3b8" font-family="monospace" font-size="9">10.0.10.1/24</text>
  </g>

  <!-- HQ Core Switch -->
  <line x1="220" y1="270" x2="220" y2="330" stroke="#64748b" stroke-width="2"/>
  <g transform="translate(160, 330)">
    <rect width="120" height="55" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="60" y="24" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SW-CORE-HQ</text>
    <text x="60" y="42" fill="#06b6d4" font-family="monospace" font-size="9" text-anchor="middle">VLAN 10, 20, 99 (HSRP)</text>
  </g>

  <!-- Branch Core Switch -->
  <line x1="580" y1="270" x2="580" y2="330" stroke="#64748b" stroke-width="2"/>
  <g transform="translate(520, 330)">
    <rect width="120" height="55" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="60" y="24" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SW-CORE-BR1</text>
    <text x="60" y="42" fill="#06b6d4" font-family="monospace" font-size="9" text-anchor="middle">VLAN 10, 30 (OSPF Area 1)</text>
  </g>

  <!-- Badges / Legend -->
  <rect x="30" y="30" width="130" height="28" rx="14" fill="#0f766e" fill-opacity="0.4" stroke="#14b8a6" stroke-width="1"/>
  <circle cx="45" cy="44" r="5" fill="#2dd4bf"/>
  <text x="58" y="48" fill="#5eead4" font-family="sans-serif" font-size="11" font-weight="600">EVE-NG Sim Lab</text>

  <rect x="630" y="30" width="140" height="28" rx="14" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1"/>
  <text x="700" y="48" fill="#7dd3fc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Full BGP &amp; OSPF</text>
</svg>
