<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#090d16" rx="12"/>
  
  <!-- Outer Box Proxmox Server -->
  <rect x="40" y="30" width="720" height="390" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="60" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="16">🖥️ PROXMOX VE HYPERVISOR CLUSTER</text>
  <text x="60" y="80" fill="#64748b" font-family="monospace" font-size="11">Host IP: 192.168.100.2 (Debian 12 Kernel, ZFS Pool)</text>

  <!-- Virtual pfSense Router -->
  <g transform="translate(80, 110)">
    <rect width="200" height="130" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <rect x="10" y="10" width="32" height="20" rx="4" fill="#e11d48"/>
    <text x="26" y="24" fill="#fff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">FW</text>
    <text x="52" y="25" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">pfSense Firewall</text>
    <text x="15" y="55" fill="#fda4af" font-family="monospace" font-size="10">WAN: vtnet0 (DHCP / NAT)</text>
    <text x="15" y="72" fill="#fda4af" font-family="monospace" font-size="10">LAN: vtnet1 (VLAN Trunk)</text>
    <text x="15" y="90" fill="#fda4af" font-family="monospace" font-size="10">WireGuard: 10.8.0.1/24</text>
    <text x="15" y="112" fill="#fb7185" font-family="sans-serif" font-size="10" font-weight="bold">Snort IDS / Suricata Active</text>
  </g>

  <!-- Trunk Bridge -->
  <line x1="280" y1="175" x2="340" y2="175" stroke="#06b6d4" stroke-width="3" stroke-dasharray="4 2"/>
  <text x="310" y="165" fill="#22d3ee" font-family="monospace" font-size="10" text-anchor="middle">802.1Q</text>

  <!-- Virtual Switch OVS / Linux Bridge -->
  <g transform="translate(340, 110)">
    <rect width="110" height="280" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="55" y="35" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">vSwitch</text>
    <text x="55" y="55" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">vmbr0</text>
    
    <!-- Ports -->
    <rect x="15" y="80" width="80" height="35" rx="4" fill="#334155"/>
    <text x="55" y="102" fill="#a5f3fc" font-family="monospace" font-size="10" text-anchor="middle">VLAN 10 (Mgmt)</text>

    <rect x="15" y="140" width="80" height="35" rx="4" fill="#334155"/>
    <text x="55" y="162" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">VLAN 20 (Srv)</text>

    <rect x="15" y="200" width="80" height="35" rx="4" fill="#334155"/>
    <text x="55" y="222" fill="#fed7aa" font-family="monospace" font-size="10" text-anchor="middle">VLAN 30 (IoT)</text>
  </g>

  <!-- Subnet VM Nodes -->
  <!-- Mgmt Node: Zabbix -->
  <line x1="450" y1="150" x2="510" y2="150" stroke="#38bdf8" stroke-width="2"/>
  <g transform="translate(510, 115)">
    <rect width="210" height="70" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="15" y="26" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">📊 Zabbix Monitoring Server</text>
    <text x="15" y="44" fill="#7dd3fc" font-family="monospace" font-size="10">IP: 10.10.10.10 | SNMP Traps</text>
    <text x="15" y="60" fill="#94a3b8" font-family="sans-serif" font-size="9">Grafana Dashboard + Telegram Alerts</text>
  </g>

  <!-- Server Node: Docker Services -->
  <line x1="450" y1="250" x2="510" y2="250" stroke="#10b981" stroke-width="2"/>
  <g transform="translate(510, 215)">
    <rect width="210" height="70" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="15" y="26" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">🐳 Docker &amp; Cloud Services</text>
    <text x="15" y="44" fill="#6ee7b7" font-family="monospace" font-size="10">IP: 10.10.20.15 | Nginx Proxy</text>
    <text x="15" y="60" fill="#94a3b8" font-family="sans-serif" font-size="9">Pi-hole DNS, Nextcloud, Syslog</text>
  </g>

  <!-- IoT / Client Node -->
  <line x1="450" y1="330" x2="510" y2="330" stroke="#f59e0b" stroke-width="2"/>
  <g transform="translate(510, 300)">
    <rect width="210" height="65" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="15" y="26" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">🔒 Isolated Client Subnet</text>
    <text x="15" y="44" fill="#fcd34d" font-family="monospace" font-size="10">IP: 10.10.30.0/24 | Client WiFi</text>
    <text x="15" y="58" fill="#94a3b8" font-family="sans-serif" font-size="9">Strict Inter-VLAN ACLs Applied</text>
  </g>

  <!-- WireGuard Client badge -->
  <g transform="translate(80, 280)">
    <rect width="200" height="75" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="15" y="25" fill="#c4b5fd" font-family="sans-serif" font-size="12" font-weight="bold">📱 Remote WireGuard Clients</text>
    <text x="15" y="45" fill="#94a3b8" font-family="monospace" font-size="10">Laptop / Mobile (Split-Tunnel)</text>
    <text x="15" y="63" fill="#a78bfa" font-family="monospace" font-size="10">ChaCha20-Poly1305 Crypto</text>
  </g>
  <line x1="180" y1="280" x2="180" y2="240" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3 3"/>
</svg>
